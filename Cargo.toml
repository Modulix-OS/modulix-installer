[package]
name = "modulixos-installer"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
futures-util = { version = "0.3.33", default-features = false }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gio = "0.22.8"
glib = "0.22.8"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7", "gtk_v4_18"] }
modulix-core-utils = { path = "../modulix-core-utils", features = ["init", "filesystem", "detect-hardware", "user", "locale"] }
quick-xml = "0.41.0"
regex = "1.11.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "sync", "fs", "io-util", "time"] }
unicode-normalization = "0.1"
webkit6 = "0.6.1"
zbus = "5"

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros"] }
