[package]
name = "modulixos-installer"
version = "1.0.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
async-trait = "0.1.92"
futures-util = { version = "0.3.34", default-features = false }
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gio = "0.22.10"
glib = "0.22.10"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9.2", features = [
    "v1_7",
    "gtk_v4_18",
] }
libc = "0.2"
modulix-core-utils = { git = "https://github.com/Modulix-OS/modulix-core-utils", tag = "v1.0.2", features = [
    "init",
    "filesystem",
    "detect-hardware",
    "user",
    "locale",
] }
quick-xml = "0.42.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "process",
    "sync",
    "fs",
    "io-util",
    "time",
] }
unicode-normalization = "0.1"
webkit6 = "0.6.1"
zbus = "5"
qrcode = { version = "0.14.1", default-features = false }
zeroize = { version = "1.9.1", features = ["alloc"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros"] }
